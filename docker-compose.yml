services:
  nginx:
    container_name: nanostory-nginx
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        BASE_IMAGE: ${DOCKER_IMAGE_PREFIX:-docker.m.daocloud.io/}nginx:1.27-alpine
    image: nanostory-nginx:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      notification-service:
        condition: service_started
      hot-update:
        condition: service_started
    environment:
      NGINX_FRONTEND_MODE: ${NGINX_FRONTEND_MODE:-static}
      FRONTEND_DIST_DIR: /srv/frontend-runtime/current
      FRONTEND_UPSTREAM: ${FRONTEND_UPSTREAM:-http://frontend-dev:5173}
      NGINX_SITE_ROOT: /usr/share/nginx/site
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-800m}
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./runtime/frontend:/srv/frontend-runtime:ro

  backend:
    container_name: nanostory-backend
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        BASE_IMAGE: ${DOCKER_IMAGE_PREFIX:-docker.m.daocloud.io/}node:20-bookworm-slim
    image: nanostory-backend:local
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_started
      notification-service:
        condition: service_started
      core-service-control:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: ${BACKEND_INTERNAL_PORT:-4000}
      BACKEND_SERVICE_ID: ${BACKEND_SERVICE_ID:-backend}
      CORE_SERVICE_URL: ${CORE_SERVICE_URL:-http://core-service-control:4100}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:4101}
      SERVICE_SHARED_SECRET: ${SERVICE_SHARED_SECRET:-change-this-shared-secret}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-nanostory}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000/nanostory}
      BACKEND_RUNTIME_DIR: /srv/backend-runtime/current
      UPLOADS_BASE_DIR: /srv/backend-data/uploads
    ports:
      - "${BACKEND_PORT:-4000}:${BACKEND_INTERNAL_PORT:-4000}"
    volumes:
      - ./runtime/backend:/srv/backend-runtime:ro
      - ./runtime/backend-data:/srv/backend-data

  notification-service:
    container_name: nanostory-notification-service
    build:
      context: .
      dockerfile: docker/notification-service/Dockerfile
      args:
        BASE_IMAGE: ${DOCKER_IMAGE_PREFIX:-docker.m.daocloud.io/}node:20-bookworm-slim
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
    image: nanostory-notification-service:local
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NOTIFICATION_SERVICE_ID: ${NOTIFICATION_SERVICE_ID:-notification-service}
      NOTIFICATION_SERVICE_PORT: 4101
      NOTIFICATION_DISPATCH_BATCH_SIZE: ${NOTIFICATION_DISPATCH_BATCH_SIZE:-100}
      NOTIFICATION_MAX_IN_FLIGHT_PER_SESSION: ${NOTIFICATION_MAX_IN_FLIGHT_PER_SESSION:-3}
      NOTIFICATION_LEASE_SECONDS: ${NOTIFICATION_LEASE_SECONDS:-15}
      SERVICE_SHARED_SECRET: ${SERVICE_SHARED_SECRET:-change-this-shared-secret}
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-4101}:4101"

  core-service-control:
    container_name: nanostory-core-service-control
    build:
      context: .
      dockerfile: docker/core-service/Dockerfile
      args:
        BASE_IMAGE: ${DOCKER_IMAGE_PREFIX:-docker.m.daocloud.io/}node:20-bookworm-slim
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
    image: nanostory-core-service:local
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SERVICE_MODE: control-plane
      SERVICE_SHARED_SECRET: ${SERVICE_SHARED_SECRET:-change-this-shared-secret}
      CORE_SERVICE_CONTROL_PORT: 4100
      CORE_SERVICE_PANEL_PUBLIC_URL: ${CORE_SERVICE_PANEL_PUBLIC_URL:-http://localhost:4102}
      NOTIFICATION_PANEL_PUBLIC_URL: ${NOTIFICATION_PANEL_PUBLIC_URL:-http://localhost:4101}
      CORE_AGENT_BASE_URL: ${CORE_AGENT_BASE_URL:-http://core-service-agent:4103}
      NODE_ID: ${NODE_ID:-local-node}
    ports:
      - "${CORE_SERVICE_PANEL_PORT:-4102}:4100"

  core-service-agent:
    container_name: nanostory-core-service-agent
    image: nanostory-core-service:local
    restart: unless-stopped
    depends_on:
      core-service-control:
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SERVICE_MODE: agent
      SERVICE_SHARED_SECRET: ${SERVICE_SHARED_SECRET:-change-this-shared-secret}
      CORE_SERVICE_AGENT_PORT: 4103
      CORE_CONTROL_URL: ${CORE_CONTROL_URL:-http://core-service-control:4100}
      CORE_SERVICE_PANEL_PUBLIC_URL: ${CORE_SERVICE_PANEL_PUBLIC_URL:-http://localhost:4102}
      NOTIFICATION_PANEL_PUBLIC_URL: ${NOTIFICATION_PANEL_PUBLIC_URL:-http://localhost:4101}
      NODE_ID: ${NODE_ID:-local-node}
      DOCKER_COMPOSE_PROJECT: ${DOCKER_COMPOSE_PROJECT:-nanostory}
      CORE_AGENT_SERVICE_ID: ${CORE_AGENT_SERVICE_ID:-core-service-agent}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
    ports:
      - "${CORE_SERVICE_AGENT_PORT:-4103}:4103"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  minio:
    container_name: nanostory-minio
    image: ${DOCKER_IMAGE_PREFIX:-docker.m.daocloud.io/}minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${DOCKER_DATA_ROOT:-./docker-data}/minio:/data

  hot-update:
    container_name: nanostory-hot-update
    build:
      context: .
      dockerfile: docker/hot-update/Dockerfile
      args:
        BASE_IMAGE: ${DOCKER_IMAGE_PREFIX:-docker.m.daocloud.io/}node:20-bookworm-slim
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
    image: nanostory-hot-update:local
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: 4205
      HOT_UPDATE_API_TOKEN: ${HOT_UPDATE_API_TOKEN:-replace-with-a-long-random-token}
      HOT_UPDATE_SHARED_SECRET: ${HOT_UPDATE_SHARED_SECRET:-replace-with-a-long-random-shared-secret}
      HOT_UPDATE_ALLOWED_CLOCK_SKEW_MS: ${HOT_UPDATE_ALLOWED_CLOCK_SKEW_MS:-300000}
      HOT_UPDATE_NONCE_TTL_MS: ${HOT_UPDATE_NONCE_TTL_MS:-600000}
      HOT_UPDATE_UPLOAD_MAX_BYTES: ${HOT_UPDATE_UPLOAD_MAX_BYTES:-734003200}
      HOT_UPDATE_KEEP_RELEASES: ${HOT_UPDATE_KEEP_RELEASES:-5}
      HOT_UPDATE_BACKEND_RESTART_CMD: ${HOT_UPDATE_BACKEND_RESTART_CMD:-docker restart nanostory-backend}
    volumes:
      - ./runtime:/app/runtime
      - /var/run/docker.sock:/var/run/docker.sock

  frontend-dev:
    profiles:
      - dev
    container_name: nanostory-frontend-dev
    image: ${DOCKER_IMAGE_PREFIX:-docker.m.daocloud.io/}node:20-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NPM_CONFIG_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
    command: >
      sh -lc "npm config set registry \"$${NPM_CONFIG_REGISTRY}\"
      && npm install
      && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    volumes:
      - ./:/app
      - frontend_dev_node_modules:/app/node_modules

volumes:
  frontend_dev_node_modules:
